name: Temp diagnostics (will be removed)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Canonical terraform fmt
        run: |
          terraform fmt -recursive terraform
          git diff --stat || true

      - name: Database connectivity probes
        run: |
          pg_isready -h localhost -p 5432 -U app -d appdb || true
          pg_isready -h 127.0.0.1 -p 5432 -U app -d appdb || true
          getent hosts localhost || true

      - name: Run tests (localhost URL)
        working-directory: app
        run: |
          npm ci
          echo "=== TEST RUN A: localhost ==="
          TEST_DATABASE_URL='postgres://app:app@localhost:5432/appdb' npm test 2>&1 | tee /tmp/tests-localhost.txt
        continue-on-error: true

      - name: Run tests (127.0.0.1 URL)
        working-directory: app
        run: |
          echo "=== TEST RUN B: 127.0.0.1 ==="
          TEST_DATABASE_URL='postgres://app:app@127.0.0.1:5432/appdb' npm test 2>&1 | tee /tmp/tests-127.txt
        continue-on-error: true

      - name: Commit results
        run: |
          mkdir -p diagnostics
          cp /tmp/tests-localhost.txt /tmp/tests-127.txt diagnostics/ 2>/dev/null || true
          git config user.name "arena-ai-coding-agent"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -A
          git commit -m "diagnostics: canonical terraform fmt + test output" || echo "nothing to commit"
          git push
